imation-delay:0.2s">Audience intelligence</text><g class="r" style="animation-delay:.3s"><text x="40.0" y="96.0" font-family="Rserif, Georgia, serif" font-size="14" fill="#B3BEB8">Collectors for TikTok, Instagram, X and Facebook, then</text><text x="40.0" y="116.5" font-family="Rserif, Georgia, serif" font-size="14" fill="#B3BEB8">vision, ML and LLM enrichment on every commenter: age</text><text x="40.0" y="137.0" font-family="Rserif, Georgia, serif" font-size="14" fill="#B3BEB8">from profile photos, gender, sentiment, language, location</text><text x="40.0" y="157.5" font-family="Rserif, Georgia, serif" font-size="14" fill="#B3BEB8">and topics, shipped as analyst-ready datasets.</text></g><g class="r" style="animation-delay:0.45s"><text x="40.0" y="230.5" font-family="Rdisp, Arial, sans-serif" font-size="22" fill="#6FCF9A">4</text><text x="40.0" y="246.5" font-family="Rmono, Menlo, Consolas, monospace" font-size="9" fill="#86938D" letter-spacing="1.2">PLATFORMS</text></g><g class="r" style="animation-delay:0.55s"><text x="125.4" y="230.5" font-family="Rdisp, Arial, sans-serif" font-size="22" fill="#6FCF9A">6</text><text x="125.4" y="246.5" font-family="Rmono, Menlo, Consolas, monospace" font-size="9" fill="#86938D" letter-spacing="1.2">ENRICHMENTS</text></g><g class="f" style="animation-delay:.7s"><rect x="40.0" y="268.5" width="58.0" height="20" rx="4" fill="#1F2825"/><text x="48.0" y="282.3" font-family="Rmono, Menlo, Consolas, monospace" font-size="10" fill="#C9D3CE">PyTorch</text><rect x="104.0" y="268.5" width="52.0" height="20" rx="4" fill="#1F2825"/><text x="112.0" y="282.3" font-family="Rmono, Menlo, Consolas, monospace" font-size="10" fill="#C9D3CE">OpenCV</text><rect x="162.0" y="268.5" width="82.0" height="20" rx="4" fill="#1F2825"/><text x="170.0" y="282.3" font-family="Rmono, Menlo, Consolas, monospace" font-size="10" fill="#C9D3CE">Pydantic AI</text><rect x="250.0" y="268.5" width="58.0" height="20" rx="4" fill="#1F2825"/><text x="258.0" y="282.3" fon