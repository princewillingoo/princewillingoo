<svg xmlns="http://www.w3.org/2000/svg" width="880" height="44" viewBox="0 0 880 44" role="img" aria-label="Selected Work"><title>Selected Work</title><style>@font-face{font-family:Rmono;src:url(data:font/woff2;base64,) format('woff2')}@keyframes rise{from{opacity:0;transform:translateY(10px)}}@keyframes fade{from{opacity:0}}@keyframes draw{from{stroke-dashoffset:1}}@keyframes stamp{from{opacity:0;transform:scale(1.5)}}.r{animation:rise .8s cubic-bezier(.2,.7,.2,1) backwards}.f{animation:fade .6s ease-out backwards}.d{stroke-dasharray:1;animation:draw 1.2s cubic-bezier(.6,0,.2,1) backwards}.s{transform-box:fill-box;transform-origin:center;animation:stamp .5s cubic-bezier(.3,1.5,.5,1) backwards}@media (prefers-reduced-motion:reduce){*{animation:none!important}}</style><text x="2.0" y="27.0" font-family="Rmono, Menlo, Consolas, monospace" font-size="12" fill="#A63B2B" letter-spacing="2">01</text><text x="34.0" y="27.0" font-family="Rmono, Menlo, Consolas, monospace" font-size="12" fill="#14201C" letter-spacing="2.4">SELECTED WORK</text><line x1="172.8" y1="22.5" x2="712.0" y2="22.5" stroke="#D9DFD7" stroke-width="1" pathLength="1" class="d" style="animation-delay:0.1s"/><text x="878.0" y="26.5" font-family="Rmono, Menlo, Consolas, monospace" font-size="10" fill="#5F6C66" text-anchor="end" letter-spacing="1.6">MOSTLY PRIVATE REPOS</text></svg>